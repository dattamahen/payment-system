version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - n8n
    restart: always

  backend:
    build: ./backend
    env_file: ./backend/.env.prod
    depends_on:
      - mongodb
      - redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: always

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    command: mongod --auth --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-eventpay}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme}
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASS:-changeme}
    volumes:
      - redis_data:/data
    restart: always

  n8n:
    image: n8nio/n8n
    environment:
      - N8N_HOST=${DOMAIN:-localhost}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN:-localhost}/n8n/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

volumes:
  mongo_data:
  redis_data:
  n8n_data:
  certbot_data:
