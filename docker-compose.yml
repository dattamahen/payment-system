version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - n8n
    restart: always

  backend:
    build: ./backend
    environment:
      - APP_NAME=EventPay SaaS
      - DEBUG=false
      - API_V1_PREFIX=/api/v1
      - MONGODB_URL=mongodb://eventpay:${MONGO_PASS:-changeme}@mongodb:27017/eventpay?authSource=admin
      - MONGODB_DB_NAME=eventpay
      - REDIS_URL=redis://:${REDIS_PASS:-changeme}@redis:6379
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-generate-64-char-hex}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ALLOWED_ORIGINS=["https://${DOMAIN:-sancham-eventpay.com}","http://${DOMAIN:-sancham-eventpay.com}"]
      - WHATSAPP_API_URL=https://graph.facebook.com/v18.0
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-eventpay-verify-token}
      - N8N_BASE_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY:-eventpay-n8n-secret-2024}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-b_KkgJlos78bUBxOZgxpsOMrlEQMdl7BMu-ifZyVUO8=}
      - ADMIN_EMAIL=sancham-admin@eventpay.com
      - ADMIN_PASSWORD=sancham@1729
    depends_on:
      - mongodb
      - redis
    restart: always

  frontend:
    build: ./frontend
    restart: always

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-eventpay}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme}
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASS:-changeme}
    volumes:
      - redis_data:/data
    restart: always

  n8n:
    image: n8nio/n8n
    environment:
      - N8N_HOST=${DOMAIN:-sancham-eventpay.com}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN:-sancham-eventpay.com}/n8n/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

volumes:
  mongo_data:
  redis_data:
  n8n_data:
